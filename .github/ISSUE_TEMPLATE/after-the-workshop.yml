name: After the workshop
description: Answer the questions from the "Borrowed from the Lab" session, with more time.
title: "[After the workshop] "
labels: ["after-the-workshop"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public**, and stays in the history even if deleted later.

        **Patterns, not names.** No client, no person, no case number, no court, no detail of an ongoing case.

        Answer only the questions you want. One sentence is enough. In English, or in your own language. Context: [workbook/after-the-workshop.md](https://github.com/caffe-doppio/dev-workshop/blob/main/workbook/after-the-workshop.md)

  - type: checkboxes
    id: public
    attributes:
      label: Before you write
      options:
        - label: I understand this issue is public. My answers contain no names, no client details, no case numbers, and nothing about an ongoing case.
          required: true

  - type: dropdown
    id: hub
    attributes:
      label: Your hub
      options:
        - AI Hub
        - Digital Democracy Hub
        - Both
        - Other

  - type: textarea
    id: learn
    attributes:
      label: What did you want to learn in this session? Did you get it?

  - type: markdown
    attributes:
      value: "## Evidence you collect"

  - type: textarea
    id: pieces
    attributes:
      label: What pieces do you collect for your strategic litigation today?
      description: Screenshots, emails, letters, exports, model outputs?
  - type: textarea
    id: storage
    attributes:
      label: Where do those pieces live right now?
      description: Email, a shared drive, a phone, a messaging app?
  - type: textarea
    id: challenged
    attributes:
      label: Has a piece of digital evidence ever been challenged in one of your cases? On what ground?
  - type: textarea
    id: ai-hub
    attributes:
      label: "AI Hub: when you document an automated decision, a score, a risk rating, what exactly do you keep?"
      description: The output, the input, the model version, the date?
  - type: textarea
    id: dd-hub
    attributes:
      label: "Digital Democracy Hub: when a portal or a platform says no, what do you have, apart from the person's word?"
  - type: textarea
    id: delay
    attributes:
      label: How long after the event do you usually receive the evidence?

  - type: markdown
    attributes:
      value: "## The limits of technical knowledge"

  - type: textarea
    id: unreadable
    attributes:
      label: Have you ever received evidence you could not read yourself? What did you do?
      description: A log, an export, a file with a strange extension.
  - type: textarea
    id: wall
    attributes:
      label: When you hit a technical wall, who do you call? Do you have that person?
  - type: textarea
    id: explain
    attributes:
      label: Have you ever had to explain something technical to a judge, or to a client? What worked? What did not?
  - type: textarea
    id: expert
    attributes:
      label: Has an expert ever said something in court that nobody in the room could check?
  - type: textarea
    id: line
    attributes:
      label: "Where is the line: what should a lawyer know, what can stay with the expert?"
  - type: textarea
    id: further
    attributes:
      label: Has a client ever asked you to look further than their own file?

  - type: markdown
    attributes:
      value: "## Looking back at the lab"

  - type: textarea
    id: surprised
    attributes:
      label: What surprised you?
  - type: textarea
    id: roles
    attributes:
      label: "If you swapped roles: what was hardest?"
  - type: textarea
    id: tools
    attributes:
      label: Which of the five tools would you actually use? Which one would never pass in your jurisdiction?
  - type: textarea
    id: judge
    attributes:
      label: What would a judge in your country need, to accept a HAR?
  - type: textarea
    id: monday
    attributes:
      label: What is the first thing you will do differently?
