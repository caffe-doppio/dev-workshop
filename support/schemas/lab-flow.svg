<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">60 minutes in the lab</title>
  <desc id="d">Session timeline: 18 minutes of framing in four parts, then 42 minutes of hands-on lab in four phases.</desc>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    .h1 { font-size: 34px; font-weight: 700; fill: #ece9f5; }
    .sub { font-size: 18px; fill: #a6a2b8; }
    .lbl { font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    .n { font-size: 18px; font-weight: 800; fill: #15141c; }
    .tick { font-size: 14px; fill: #6b6880; }
    .lg { font-size: 18px; fill: #ece9f5; }
    .mn { fill: #a6a2b8; }
    .foot { font-size: 18px; font-weight: 600; fill: #ffb3a1; }
  </style>
  <rect width="1200" height="560" rx="24" fill="#15141c"/>
  <text x="60" y="70" class="h1">60 minutes in the lab</text>
  <text x="60" y="104" class="sub">30% framing, 70% hands-on. No slides: this repository is the support.</text>

  <text x="60" y="146" class="lbl" fill="#b9a8ff">FRAMING · 18 MIN</text>
  <text x="384" y="146" class="lbl" fill="#ffb3a1">LAB · 42 MIN</text>

  <g>
    <rect x="61" y="160" width="52" height="60" rx="6" fill="#b9a8ff"/>
    <rect x="115" y="160" width="88" height="60" rx="6" fill="#b9a8ff"/>
    <rect x="205" y="160" width="124" height="60" rx="6" fill="#b9a8ff"/>
